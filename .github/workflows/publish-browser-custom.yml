name: Chrome Extension Release

on:
  push:
    branches:
      - main
    tags:
      - 'browser-custom-v*'
    paths:
      - 'apps/browser/**'
      - 'libs/**'
      - 'bitwarden_license/bit-common/**'
      - 'bitwarden_license/bit-pam/**'
      - 'bitwarden_license/bit-pam-components/**'
      - '.npmrc'
      - 'babel.config.json'
      - 'tailwind.config.js'
      - 'e2e/infra/chrome/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'tsconfig*.json'
      - '.github/workflows/publish-browser-custom.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional numeric version for a new release'
        required: false
        type: string

      publish:
        description: 'Publish a GitHub Release after CI succeeds'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: custom-chrome-stable-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .debug
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > .debug/custom-previous-releases.json
          node --experimental-strip-types apps/browser/scripts/resolve-custom-release.mjs .debug/custom-previous-releases.json
      - run: npm ci
      - name: Test update packaging
        run: node --experimental-strip-types --test apps/browser/scripts/custom-update-package.test.mjs
      - name: Test all browser extension features
        run: npm exec --workspace @bitwarden/browser -- jest --maxWorkers=2
      - name: Download and verify previous custom release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node --experimental-strip-types apps/browser/scripts/verify-custom-update.mjs prepare --version "$RELEASE_VERSION" --out .debug/custom-baseline
      - name: Reuse the verified published extension
        id: reuse
        if: steps.version.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --experimental-strip-types apps/browser/scripts/verify-custom-update.mjs prepare --reuse-current --version "$RELEASE_VERSION" --out .debug/custom-current
          mv .debug/custom-current/build apps/browser/build
      - name: Build Chrome extension
        if: steps.version.outputs.changed == 'true'
        run: npm run build:prod:chrome --workspace @bitwarden/browser
      - name: Package full and incremental updates
        id: package
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          base_args=()
          if [[ -f .debug/custom-baseline/build/custom-update-installed.json ]]; then
            base_args=(--base .debug/custom-baseline/build)
          fi
          node --experimental-strip-types apps/browser/scripts/package-custom-update.mjs package \
            --build apps/browser/build --out .debug/custom-release --version "$RELEASE_VERSION" "${base_args[@]}"
          node --experimental-strip-types apps/browser/scripts/verify-custom-update.mjs verify \
            --release .debug/custom-release --config apps/browser/build/custom-update-config.json "${base_args[@]}"
      - name: Test packaged Chrome unlock with the side panel closed
        run: node e2e/infra/chrome/run.mjs --provider docker --suite authenticated --extension apps/browser/build
      - name: Test packaged Chrome unlock with the side panel already open
        if: ${{ !cancelled() && (steps.package.outcome == 'success' || steps.reuse.outcome == 'success') }}
        run: node e2e/infra/chrome/run.mjs --provider docker --suite authenticated --extension apps/browser/build --preopen-panel
      - name: Test packaged Chrome passkeys through the side panel
        if: ${{ !cancelled() && (steps.package.outcome == 'success' || steps.reuse.outcome == 'success') }}
        run: node e2e/infra/chrome/run.mjs --provider docker --suite authenticated --extension apps/browser/build --passkey-panel
      - name: Upload Chrome E2E reports
        id: chrome-e2e-reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-e2e-${{ github.run_id }}
          path: .debug/chrome-e2e/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize Chrome E2E runs and cases
        if: always()
        env:
          CHROME_E2E_ARTIFACT_URL: ${{ steps.chrome-e2e-reports.outputs.artifact-url }}
          CHROME_E2E_ARTIFACT_NAME: chrome-e2e-${{ github.run_id }}
        run: |
          node e2e/infra/chrome/summarize-reports.mjs \
            --expected closed-panel --expected preopened-locked-panel --expected passkey-panel
      - name: Upload verified release assets
        if: steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-extension-${{ steps.version.outputs.version }}
          path: .debug/custom-release/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Add download and installation instructions
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Install the extension
          Download **chrome-extension-$RELEASE_VERSION** from this run's Artifacts.
          1. Extract the artifact, then extract **extension-chrome-custom-$RELEASE_VERSION.zip** to a permanent folder.
          2. Open **chrome://extensions** and enable **Developer mode**.
          3. Click **Load unpacked** and select the folder containing **manifest.json**.
          4. Settings → Appearance: enable **Side panel mode** as needed. Open **Custom extension updates** and connect that same installation folder. Version checks run after unlocking when 24 hours have elapsed; installation requires clicking **Apply update**.

          Existing installations: keep the same extension and installation folder. Use **Apply update** inside the extension. If its updater is blocked, follow the [same-folder recovery instructions](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/browser-extension-github-auto-update.md); do not remove and reinstall the extension.
          On macOS use an ordinary home subfolder such as **~/ChromeExtensions/Bitwarden**. File System Access blocks **/Applications**, **~/Applications**, and their subfolders.
          EOF

  publish:
    if: >-
      ${{ needs.build.outputs.changed == 'true' &&
          (github.event_name == 'push' || inputs.publish) }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chrome-extension-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          release_tag="browser-custom-v$RELEASE_VERSION"
          cat > release-notes.txt <<EOF
          Custom Chrome extension $RELEASE_VERSION

          First installation: download extension-chrome-custom-$RELEASE_VERSION.zip and extract it to a permanent folder. Open chrome://extensions, enable Developer mode, click Load unpacked, and select the folder containing manifest.json.
          On macOS use an ordinary home subfolder such as ~/ChromeExtensions/Bitwarden; /Applications and ~/Applications are blocked for internal file updates.
          Enable Side panel mode in Settings → Appearance as needed.
          Connect the same installation folder under Custom extension updates. New versions are checked after unlocking when 24 hours have elapsed. Click Apply update to install; updates are applied only by clicking this button.

          Existing installations: keep the same extension and installation folder to preserve its ID and account storage. If the existing updater is blocked, follow the same-folder recovery instructions instead of removing and reinstalling the extension.
          Update and recovery guide: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/browser-extension-github-auto-update.md
          Test scenarios: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/browser-extension-custom-features-testing.md
          EOF
          if gh release view "$release_tag" --json isDraft,targetCommitish > release-state.json 2> release-error.txt; then
            jq -e --arg commit "$GITHUB_SHA" '.isDraft and .targetCommitish == $commit' release-state.json > /dev/null
          else
            gh release create "$release_tag" --target "$GITHUB_SHA" --draft --title "Custom Chrome $RELEASE_VERSION" --notes-file release-notes.txt
          fi
          gh release upload "$release_tag" release-assets/* --clobber
          gh release edit "$release_tag" --draft=false
          printf '[Download Chrome extension %s](https://github.com/%s/releases/tag/%s)\n' "$RELEASE_VERSION" "$GITHUB_REPOSITORY" "$release_tag" >> "$GITHUB_STEP_SUMMARY"
