name: Chrome Extension E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Chrome extension
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Build Chrome extension
        run: npm run build:prod:chrome --workspace @bitwarden/browser
      - name: Upload the build for E2E jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-e2e-build
          path: apps/browser/build/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14
      - name: Report blocked E2E cases
        if: failure()
        run: |
          node e2e/infra/chrome/summarize-reports.mjs \
            --expected closed-panel --expected preopened-locked-panel --expected passkey-panel --expected playwright

  chrome-e2e:
    name: Chrome E2E (${{ matrix.variant }})
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [closed-panel, preopened-locked-panel, passkey-panel, playwright]
    env:
      CHROME_E2E_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chrome-e2e-build
          path: apps/browser/build/
      - name: Run Chrome E2E against a temporary Vaultwarden
        run: |
          case "$CHROME_E2E_VARIANT" in
            closed-panel) args=(--suite authenticated) ;;
            preopened-locked-panel) args=(--suite authenticated --preopen-panel) ;;
            passkey-panel) args=(--suite authenticated --passkey-panel) ;;
            playwright) args=(--suite playwright) ;;
            *) exit 2 ;;
          esac
          node e2e/infra/chrome/run.mjs --provider docker "${args[@]}"
      - name: Upload Chrome E2E reports
        id: chrome-e2e-reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-e2e-${{ matrix.variant }}-${{ github.run_attempt }}
          path: .debug/chrome-e2e/*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize Chrome E2E runs and cases
        if: always()
        env:
          CHROME_E2E_ARTIFACT_URL: ${{ steps.chrome-e2e-reports.outputs.artifact-url }}
          CHROME_E2E_ARTIFACT_NAME: chrome-e2e-${{ matrix.variant }}-${{ github.run_attempt }}
        run: node e2e/infra/chrome/summarize-reports.mjs --expected "$CHROME_E2E_VARIANT"
